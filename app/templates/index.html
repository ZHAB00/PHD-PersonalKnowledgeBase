<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业知识库</title>
<link rel="stylesheet" href="/static/css/style.css?v=6">
</head>
<body>
<div id="app">

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <button class="btn-new-chat" id="btnNewChat">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      <span>新建对话</span>
    </button>
  </div>
  <div class="session-list" id="sessionList">
    <div class="session-items" id="sessionItems"></div>
  </div>
  <div class="sidebar-footer">
    <button class="nav-item-side" id="navDocuments">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      <span>文档管理</span>
    </button>
    <div class="sidebar-status"><span class="status-dot" id="statusDot"></span><span id="statusText">连接中...</span></div>
    <button class="btn-logout" id="btnLogout" title="退出登录">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
  </div>
</aside>

<main class="main">
  <section id="view-chat" class="view active">
    <div class="chat-container">
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-kb-bar" id="chatKbBar">
        <span class="chat-kb-label">知识库：</span>
        <select class="chat-kb-select" id="chatKbSelect"><option value="default">默认知识库</option></select>
      </div>
      <div class="chat-input-area">
        <textarea class="chat-input" id="chatInput" rows="1" placeholder="输入你的问题..." disabled></textarea>
        <button class="btn btn-primary chat-send" id="sendBtn" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>
  </section>

  <section id="view-documents" class="view">
    <div class="view-header">
      <h2>文档管理</h2>
      <div class="kb-selector" id="kbSelector">
        <select id="kbSelect"><option value="default">默认知识库</option></select>
        <button class="btn-kb-add" id="btnKbAdd" title="新建知识库">+</button>
        <button class="btn-kb-edit" id="btnKbEdit" title="编辑知识库" style="display:none">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </button>
        <button class="btn-kb-del" id="btnKbDel" title="删除当前知识库" style="display:none">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
        </button>
      </div>
    </div>
    <div class="upload-zone" id="uploadZone">
      <div class="upload-icon">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      </div>
      <p class="upload-text">拖拽文件到此处，或<a href="#" id="uploadLink">点击选择文件</a></p>
      <p class="upload-hint">支持 PDF、DOCX、MD、TXT 格式</p>
      <input type="file" id="fileInput" accept=".pdf,.docx,.md,.txt" multiple hidden>
    </div>
    <div class="doc-list" id="docList">
      <div class="doc-list-header"><h3>已上传文档</h3><span class="doc-count" id="docCount">0 份</span></div>
      <div class="doc-items" id="docItems"></div>
    </div>
  </section>
</main>

<aside class="sources-panel" id="sourcesPanel">
  <div class="sources-header"><h3>来源引用</h3></div>
  <div class="sources-list" id="sourcesList"><p class="sources-empty">对话时将显示检索到的文档片段</p></div>
</aside>

<div class="modal-overlay" id="confirmModal" style="display:none">
  <div class="modal-box">
    <p id="confirmText">确定要删除此文档吗？</p>
    <div class="modal-actions">
      <button class="btn" id="confirmCancel">取消</button>
      <button class="btn btn-primary" id="confirmOk">确定</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="kbModal" style="display:none">
  <div class="modal-box">
    <h3 id="kbModalTitle">新建知识库</h3>
    <div class="form-group"><label>名称</label><input type="text" id="kbName" class="form-input" placeholder="输入知识库名称" maxlength="64"></div>
    <div class="form-group"><label>描述（可选）</label><input type="text" id="kbDesc" class="form-input" placeholder="简要描述" maxlength="256"></div>
    <div class="modal-actions">
      <button class="btn" id="kbCancel">取消</button>
      <button class="btn btn-primary" id="kbCreate">创建</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="kbDelModal" style="display:none">
  <div class="modal-box">
    <h3>删除知识库</h3>
    <p class="kb-del-warn">此操作不可恢复！知识库中所有文档和数据将被永久删除。</p>
    <div class="form-group">
      <label>请输入 <strong>A1B2C3D4</strong></label>
      <input type="text" id="kbDelCode" class="form-input" placeholder="A1B2C3D4" maxlength="8" autocomplete="off">
      <p class="form-hint" id="kbDelHint" style="display:none;color:#e53e3e;font-size:12px;"></p>
    </div>
    <div class="modal-actions">
      <button class="btn" id="kbDelCancel">取消</button>
      <button class="btn btn-danger" id="kbDelOk">确认删除</button>
    </div>
  </div>
</div>

</div>

<script>
var _t = localStorage.getItem("kb_token");
if (!_t) { window.location.href = "/login"; }
</script>
<script src="/static/js/app.js?v=6"></script>
</body>
</html>
