<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDH-PKG</title>
  <link rel="stylesheet" href="/static/css/style.css?v=39">
  <script src="https://unpkg.com/vis-network@9.1.6/dist/vis-network.min.js"></script>
  <link href="https://unpkg.com/vis-network@9.1.6/dist/vis-network.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
    </head>
<body>
<div id="app">

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <button class="btn-new-chat" id="btnNewChat">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      <span>新建对话</span>
    </button>
  </div>
  <div class="session-list" id="sessionList">
    <div class="session-items" id="sessionItems"></div>
  </div>
  <div class="sidebar-footer">
    
    <button class="nav-item-side" id="navGraph">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="2"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="19" r="2"/><path d="M12 7v5"/><path d="M6.5 17.5 11 12"/><path d="M13 12l4.5 5.5"/></svg>
      <span>知识图谱</span>
    </button>

    <button class="nav-item-side" id="navDocuments">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      <span>文档管理</span>
    </button>
    <button class="nav-item-side" id="navSettings">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span>设置</span>
    </button>
  </div>
</aside>

<main class="main">
  <section id="view-chat" class="view active">
    <div class="chat-container">
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-kb-bar" id="chatKbBar">
        <span class="chat-kb-label">知识库：</span>
        <select class="chat-kb-select" id="chatKbSelect"><option value="default">默认知识库</option></select>
        <button class="kb-graphrag-toggle active" id="graphRagToggle" onclick="toggleGraphRag()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="5" r="2"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="19" r="2"/><path d="M12 7v5"/><path d="M6.5 17.5 11 12"/><path d="M13 12l4.5 5.5"/></svg>
          图谱
        </button>
      </div>
      <div class="chat-input-area">
        <textarea class="chat-input" id="chatInput" rows="1" placeholder="输入你的问题..." disabled></textarea>
        <button class="btn chat-stop" id="stopBtn" title="停止生成" aria-label="停止生成" style="display:none" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>
        </button>
        <button class="btn btn-primary chat-send" id="sendBtn" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>
  </section>

  <section id="view-documents" class="view">
    <div class="view-header">
      <h2>文档管理</h2>
      <div class="kb-selector" id="kbSelector">
        <select id="kbSelect"><option value="default">默认知识库</option></select>
        <button class="btn-kb-add" id="btnKbAdd" title="新建知识库">+</button>
        <button class="btn-kb-edit" id="btnKbEdit" title="编辑知识库">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </button>
        <button class="btn-kb-del" id="btnKbDel" title="删除当前知识库">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
        </button>
      </div>
    </div>
    <div class="upload-zone" id="uploadZone">
      <div class="upload-icon">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      </div>
      <p class="upload-text">拖拽文件到此处，<a href="#" id="uploadLink">点击选择文件</a></p>
      <p class="upload-hint">支持 PDF、DOCX、MD、TXT 格式</p>
      <input type="file" id="fileInput" accept=".pdf,.docx,.md,.txt" multiple hidden>
    </div>
    <div class="doc-list" id="docList">
      <div class="doc-list-header"><h3>已上传文档</h3><span class="doc-count" id="docCount">0 个</span></div>
      <div class="doc-items" id="docItems"></div>
    </div>
  </section>
  <section id="view-graph" class="view">
    <div class="graph-toolbar">
      <label class="graph-kb-label" for="graphKbSelect">
        <span>知识库</span>
        <select id="graphKbSelect"><option value="default">默认知识库</option></select>
      </label>
      <div class="graph-search-wrap">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" class="graph-search" id="graphSearch" placeholder="搜索实体" autocomplete="off">
      </div>
      <button class="graph-tool-btn" id="graphRefresh" title="刷新图谱">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        <span>刷新</span>
      </button>
      <button class="graph-tool-btn graph-tool-btn-primary" id="graphBuild" title="构建图谱">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>
        <span>构建</span>
      </button>
      <div class="graph-mode-toggle" id="graphModeToggle" role="group" aria-label="图谱显示模式">
        <button class="graph-mode-btn active" id="graphMode2d" title="平面布局">2D</button>
        <button class="graph-mode-btn" id="graphMode3d" title="3D 球面布局">3D</button>
      </div>
      <label class="graph-design-label" id="graphDesignWrap" for="graphDesign">
        <span>设计</span>
        <select id="graphDesign">
          <option value="stellar">星际星云</option>
          <option value="hologram">全息晶体</option>
          <option value="neon">霓虹电路</option>
          <option value="minimal">浅色极简</option>
        </select>
      </label>
      <span class="graph-stats" id="graphStats"></span>
    </div>
    <div class="graph-stage" id="graphStage">
      <div class="graph-container" id="graphContainer"></div>
      <div class="graph-loading" id="graphLoading">
        <span class="graph-spinner"></span>
        <span>正在加载图谱...</span>
      </div>
      <div class="graph-legend" id="graphLegend"></div>
      <div class="graph-controls" id="graphControls">
        <button class="graph-control-btn" id="graphFit" title="适应画布">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
        </button>
        <button class="graph-control-btn" id="graphZoomIn" title="放大">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
        </button>
        <button class="graph-control-btn" id="graphZoomOut" title="缩小">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
        </button>
      </div>
    </div>
  </section>

  <section id="view-settings" class="view">
    <div class="view-header settings-header">
      <div class="settings-header-left">
        <button class="icon-btn" id="settingsBack" title="返回对话" aria-label="返回对话">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        </button>
        <h2>设置</h2>
      </div>
      <button class="btn btn-primary" id="saveSettings">保存设置</button>
    </div>
    <div class="settings-loading" id="settingsLoading" style="display:none">
      <span class="spinner"></span><span>正在加载设置...</span>
    </div>
    <div class="settings-body">
      <div class="settings-group">
        <h3><span class="settings-group-index">1</span>对话模型</h3>
        <label>类型
          <select id="setChatProvider">
            <option value="deepseek">DeepSeek（云端）</option>
            <option value="openai_compatible">OpenAI 兼容（云端）</option>
            <option value="ollama">Ollama（本地）</option>
            <option value="lmstudio">LM Studio / llama.cpp（本地）</option>
          </select>
        </label>
        <label>Base URL <input id="setChatBaseUrl" placeholder="留空使用默认"></label>
        <label>API Key <input id="setChatApiKey" type="password" placeholder="云端必填，本地可留空"></label>
        <label>模型名 <input id="setChatModel" placeholder="例如 deepseek-v4-flash / qwen2.5:7b"></label>
        <label><input type="checkbox" id="setChatThinking"> 启用思考模式（DeepSeek）</label>
        <button class="btn" id="testChat">测试连接</button>
        <p class="settings-hint" id="chatTestResult"></p>
      </div>
      <div class="settings-group">
        <h3><span class="settings-group-index">2</span>向量化模型</h3>
        <label>类型
          <select id="setEmbeddingProvider">
            <option value="ollama">Ollama（本地，默认）</option>
            <option value="local">内置本地模型（ONNX，首次使用自动下载）</option>
            <option value="openai_compatible">OpenAI 兼容（云端）</option>
          </select>
        </label>
        <label>模型 <input id="setEmbeddingModel" placeholder="默认 qwen3-embedding:4b"></label>
        <label>Base URL <input id="setEmbeddingBaseUrl" placeholder="Ollama/云端填，内置留空"></label>
        <label>API Key <input id="setEmbeddingApiKey" type="password" placeholder="云端必填"></label>
        <button class="btn" id="testEmbedding">测试连接</button>
        <p class="settings-hint" id="embeddingTestResult"></p>
      </div>
      <div class="settings-group">
        <h3><span class="settings-group-index">3</span>联网搜索</h3>
        <p class="settings-hint">自动模式无需 API Key：优先 Bing，失败自动切换 DuckDuckGo。</p>
        <label>类型
          <select id="setSearchProvider">
            <option value="auto">自动（推荐）</option>
            <option value="tavily">Tavily</option>
            <option value="searxng">SearXNG（自建）</option>
            <option value="bing">Bing 网页搜索</option>
            <option value="duckduckgo">DuckDuckGo</option>
          </select>
        </label>
        <label>Base URL <input id="setSearchBaseUrl" placeholder="Tavily/SearXNG 填，Bing/DuckDuckGo 留空"></label>
        <label>API Key <input id="setSearchApiKey" type="password" placeholder="Tavily 必填，其他可留空"></label>
        <button class="btn" id="testSearch">测试连接</button>
        <p class="settings-hint" id="searchTestResult"></p>
      </div>
      <div class="settings-group">
        <h3><span class="settings-group-index">4</span>知识图谱（Neo4j，可选）</h3>
        <label><input type="checkbox" id="setNeo4jEnabled"> 启用 Neo4j 知识图谱</label>
        <label>地址 <input id="setNeo4jUri" value="bolt://localhost:7687"></label>
        <label>账号 <input id="setNeo4jUser" value="neo4j"></label>
        <label>密码 <input id="setNeo4jPassword" type="password"></label>
        <label>数据库 <input id="setNeo4jDatabase" value="neo4j"></label>
        <button class="btn" id="testNeo4j">测试连接</button>
        <p class="settings-hint" id="neo4jTestResult"></p>
      </div>
      <div class="settings-group">
        <h3><span class="settings-group-index">5</span>访问与存储</h3>
        <label><input type="checkbox" id="setRequirePassword"> 开启访问密码（默认免登录）</label>
        <label>密码 <input id="setPassword" type="password" placeholder="留空不修改"></label>
        <p class="settings-hint">数据目录：<span id="setDataDir"></span></p>
        <p class="settings-hint" id="settingsSaveResult"></p>
      </div>
    </div>
  </section>
</main>

<div class="modal-overlay" id="confirmModal" style="display:none">
  <div class="modal-box">
    <p id="confirmText">确定要删除此文档吗？</p>
    <div class="modal-actions">
      <button class="btn" id="confirmCancel">取消</button>
      <button class="btn btn-primary" id="confirmOk">确定</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="kbModal" style="display:none">
  <div class="modal-box">
    <h3 id="kbModalTitle">新建知识库</h3>
    <div class="form-group"><label>名称</label><input type="text" id="kbName" class="form-input" placeholder="输入知识库名称" maxlength="64"></div>
    <div class="form-group"><label>描述（可选）</label><input type="text" id="kbDesc" class="form-input" placeholder="简要描述" maxlength="256"></div>
    <div class="modal-actions">
      <button class="btn" id="kbCancel">取消</button>
      <button class="btn btn-primary" id="kbCreate">创建</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="kbDelModal" style="display:none">
  <div class="modal-box">
    <h3>删除知识库</h3>
    <p class="kb-del-warn">此操作不可恢复！知识库中所有文档和数据将被永久删除。</p>
    <div class="form-group">
      <label>请输入 <strong>A1B2C3D4</strong></label>
      <input type="text" id="kbDelCode" class="form-input" placeholder="A1B2C3D4" maxlength="8" autocomplete="off">
      <p class="form-hint" id="kbDelHint" style="display:none;color:#e53e3e;font-size:12px;"></p>
    </div>
    <div class="modal-actions">
      <button class="btn" id="kbDelCancel">取消</button>
      <button class="btn btn-danger" id="kbDelOk">确认删除</button>
    </div>
  </div>
</div>

</div>

<script>
var _t = localStorage.getItem("kb_token");
if (!_t) { window.location.href = "/login"; }
</script>
  <script src="/static/js/app.js?v=80"></script>
</body>
</html>
