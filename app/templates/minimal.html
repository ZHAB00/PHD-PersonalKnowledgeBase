<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Minimal Test</title>
<style>
body { font-family: sans-serif; margin: 20px; background: #f5f5f5; }
.card { background: white; padding: 20px; margin: 10px 0; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
button { padding: 8px 16px; margin: 4px; cursor: pointer; border-radius: 6px; border: 1px solid #ccc; }
.btn-primary { background: #4f46e5; color: white; border-color: #4f46e5; }
input { padding: 8px; border: 1px solid #ccc; border-radius: 6px; width: 200px; }
.result { background: #1a1a2e; color: #0f0; padding: 10px; border-radius: 6px; font-family: monospace; font-size: 12px; margin-top: 10px; white-space: pre-wrap; max-height: 400px; overflow: auto; }
.error { color: #e53e3e; }
</style>
</head>
<body>
<h1>Minimal Integration Test</h1>

<div class="card">
  <h3>1. Auth</h3>
  <button id="btnLogin" class="btn-primary">Login</button>
  <span id="loginResult"></span>
</div>

<div class="card">
  <h3>2. KB List</h3>
  <button id="btnKbList">Load Knowledge Bases</button>
  <div id="kbResult" class="result" style="display:none"></div>
</div>

<div class="card">
  <h3>3. Documents (default KB)</h3>
  <button id="btnDocs">Load Documents</button>
  <div id="docResult" class="result" style="display:none"></div>
</div>

<div class="card">
  <h3>4. Chat</h3>
  <input id="chatInput" placeholder="Ask something..." />
  <button id="btnChat" class="btn-primary">Send</button>
  <div id="chatResult" class="result" style="display:none"></div>
</div>

<div class="card">
  <h3>5. Session</h3>
  <button id="btnNewSession">New Session</button>
  <span id="sessionId">session: -</span>
</div>

<script>
var token = "";
var sessionId = "test_" + Date.now();

function show(id, text) {
  var el = document.getElementById(id);
  el.style.display = "block";
  el.textContent = text;
}

function log(msg) { console.log(msg); }

  // 认证
document.getElementById("btnLogin").addEventListener("click", async function() {
  try {
    var resp = await fetch("/api/auth/local-token");
    var data = await resp.json();
    token = data.access_token;
    document.getElementById("loginResult").textContent = "OK: " + data.username;
    document.getElementById("loginResult").className = "";
  } catch(e) {
    document.getElementById("loginResult").textContent = "FAIL: " + e.message;
    document.getElementById("loginResult").className = "error";
  }
});

  // 知识库列表
document.getElementById("btnKbList").addEventListener("click", async function() {
  try {
    var resp = await fetch("/api/kb/list?tenant_id=default", {
      headers: {"Authorization": "Bearer " + token}
    });
    var data = await resp.json();
    show("kbResult", JSON.stringify(data, null, 2));
  } catch(e) {
    show("kbResult", "ERROR: " + e.message);
  }
});

  // 文档
document.getElementById("btnDocs").addEventListener("click", async function() {
  try {
    var resp = await fetch("/api/documents/list?kb_id=default&tenant_id=default", {
      headers: {"Authorization": "Bearer " + token}
    });
    var data = await resp.json();
    show("docResult", JSON.stringify(data, null, 2));
  } catch(e) {
    show("docResult", "ERROR: " + e.message);
  }
});

  // 会话
document.getElementById("btnNewSession").addEventListener("click", function() {
  sessionId = "test_" + Date.now();
  document.getElementById("sessionId").textContent = "session: " + sessionId;
});

document.getElementById("sessionId").textContent = "session: " + sessionId;

  // 聊天
document.getElementById("btnChat").addEventListener("click", async function() {
  var msg = document.getElementById("chatInput").value.trim();
  if (!msg) return;
  try {
    var resp = await fetch("/api/chat/stream", {
      method: "POST",
      headers: {"Authorization": "Bearer " + token},
      body: new URLSearchParams({
        session_id: sessionId,
        message: msg,
        kb_id: "default",
        tenant_id: "default",
        user_id: "admin",
        top_k: "5",
        rerank_strategy: "none"
      })
    });
    var text = await resp.text();
    show("chatResult", text.substring(0, 1000));
  } catch(e) {
    show("chatResult", "ERROR: " + e.message);
  }
});
</script>
</body>
</html>
